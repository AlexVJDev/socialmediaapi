spring:
  application:
    name: social-media-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/social_media}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  modulith:
    detection-strategy: explicitly-annotated
  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    default-schema: public
    # dev - also the Swagger UI examples db/dev/swagger-examples.sql; never empty: empty runs every context
    contexts: ${LIQUIBASE_CONTEXTS:default}
  # Static /openapi/** (the contract for Swagger UI): Cache-Control no-cache - the browser revalidates every file
  # (304 if unchanged), otherwise it keeps an old contract by heuristic caching and Swagger UI sends old requests.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

# Swagger UI shows the static contract docs/api/openapi.yaml (published as /openapi/** by the build).
# springdoc.api-docs stays enabled: Swagger UI reads its config from /v3/api-docs/swagger-config;
# the generated /v3/api-docs itself is not used by the UI (url below).
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}  # false - Swagger UI is off (the static /openapi/** stays)
    path: /swagger-ui.html
    url: /openapi/openapi.yaml
    disable-swagger-default-url: true
    try-it-out-enabled: true
