get:
  summary: Получить список подписчиков пользователя
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список подписчиков
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    '200':
      description: Список пользователей, подписанных на текущего пользователя
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
                - username
                - displayName
              properties:
                id:
                  type: integer
                  format: int64
                  example: 1
                username:
                  type: string
                  example: alice
                displayName:
                  type: string
                  example: Alice
          examples:
            found:
              value:
                - id: 1
                  username: alice
                  displayName: Alice
                - id: 3
                  username: maria
                  displayName: Maria
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_USER_ID
              message:
                type: string
                example: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь не найден
