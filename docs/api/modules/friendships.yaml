# Входная спецификация модуля для генерации кода (openapi-generator-maven-plugin в pom.xml).
# Пути и их файлы должны совпадать с docs/api/openapi.yaml: при добавлении пути модуля — добавить и сюда.
openapi: 3.0.3
info:
  title: API социальной сети — дружба
  version: 1.0.0
paths:
  /api/v1/friendship-offer:
    $ref: '../paths/friendship-offers-get.yaml'
  /api/v1/friendship-offer/{offerId}:
    $ref: '../paths/friendship-offer-get.yaml'
  /api/v1/friendship-offer/create:
    $ref: '../paths/friendship-offer-create.yaml'
  /api/v1/friendship-offer/accept:
    $ref: '../paths/friendship-offer-accept.yaml'
  /api/v1/friendship-offer/reject:
    $ref: '../paths/friendship-offer-reject.yaml'
  /api/v1/friendship-offer/incoming:
    $ref: '../paths/friendships-incoming-get.yaml'
  /api/v1/friendship-offer/outgoing:
    $ref: '../paths/friendships-outgoing-get.yaml'
  /api/v1/friendships:
    $ref: '../paths/friends-get.yaml'
