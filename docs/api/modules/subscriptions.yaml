# Входная спецификация модуля для генерации кода (openapi-generator-maven-plugin в pom.xml).
# Пути и их файлы должны совпадать с docs/api/openapi.yaml: при добавлении пути модуля — добавить и сюда.
openapi: 3.0.3
info:
  title: API социальной сети — подписки
  version: 1.0.0
paths:
  /api/v1/subscribes/followers:
    $ref: '../paths/followers-get.yaml'
  /api/v1/subscribes:
    $ref: '../paths/subscribes.yaml'
  /api/v1/subscribes/{userId}:
    $ref: '../paths/subscribe-delete.yaml'
components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: Временная замена токена до подключения Keycloak
