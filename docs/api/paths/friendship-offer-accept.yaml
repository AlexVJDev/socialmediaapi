post:
  tags:
    - FriendshipOffer
  summary: Принять предложение дружбы
  operationId: acceptFriendshipOffer
  security:
    - userIdHeader: []
  description: >-
    Действующий пользователь — текущий (заголовок X-User-Id); принять заявку может только её получатель.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - offerId
          properties:
            offerId:
              type: string
              format: uuid
              description: Идентификатор принимаемого предложения дружбы.
              example: 0f000000-0000-4000-8000-000000000001
  responses:
    '200':
      description: >-
        Предложение дружбы принято. В одной транзакции создаются дружба и подписка получателя
        на инициатора (если её ещё нет)
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
              - createdAt
              - acceptedAt
            properties:
              id:
                type: string
                format: uuid
                example: 0f000000-0000-4000-8000-000000000001
              fromUserId:
                type: string
                format: uuid
                example: 00000000-0000-4000-8000-000000000001
              toUserId:
                type: string
                format: uuid
                example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
              status:
                type: string
                enum: [ACCEPTED]
                example: ACCEPTED
              createdAt:
                type: string
                format: date-time
                example: '2026-10-01T10:00:00Z'
              acceptedAt:
                type: string
                format: date-time
                description: Время смены статуса (`updated_at` заявки).
                example: '2026-10-01T10:05:00Z'
    '400':
      description: >-
        Некорректный запрос: тело не читается, отсутствует `offerId` или он не является UUID.
        Невалидное тело без X-User-Id — тоже `400`: тело проверяется раньше заголовка
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '401':
      $ref: '../responses/unauthorized.yaml'
    '404':
      description: >-
        Предложение дружбы не найдено: его нет или текущий пользователь (X-User-Id) не является его получателем
        (существование чужой заявки не раскрывается)
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 404
            detail: Предложение дружбы не найдено
            code: FRIENDSHIP_OFFER_NOT_FOUND
    '409':
      description: >-
        Предложение дружбы нельзя принять, так как его статус отличен от 'PENDING' ('ACCEPTED' или 'REJECTED');
        в том числе повторное принятие. Данные не меняются
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          examples:
            accepted:
              value:
                status: 409
                detail: Предложение дружбы уже принято
                code: FRIENDSHIP_OFFER_ALREADY_ACCEPTED
            rejected:
              value:
                status: 409
                detail: Предложение дружбы уже отклонено
                code: FRIENDSHIP_OFFER_ALREADY_REJECTED
    '500':
      $ref: '../responses/internal-error.yaml'
