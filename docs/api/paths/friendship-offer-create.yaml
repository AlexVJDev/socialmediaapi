post:
  tags:
    - FriendshipOffer
  summary: Создать предложение дружбы
  operationId: createFriendshipOffer
  security:
    - userIdHeader: []
  description: >-
    Отправитель — текущий пользователь (заголовок X-User-Id), получатель — `toUserId` из тела.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - toUserId
          properties:
            toUserId:
              type: string
              format: uuid
              description: Получатель предложения дружбы.
              example: 3f8a2c6e-4b1d-4e7a-9c5f-1d2e3f4a5b60
  responses:
    '201':
      description: Предложение дружбы создано
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
              - createdAt
            properties:
              id:
                type: string
                format: uuid
                example: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
              fromUserId:
                type: string
                format: uuid
                example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
              toUserId:
                type: string
                format: uuid
                example: 3f8a2c6e-4b1d-4e7a-9c5f-1d2e3f4a5b60
              status:
                type: string
                enum: [PENDING]
                example: PENDING
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
    '200':
      description: >-
        Предложение дружбы между этими пользователями уже существует и находится в статусе 'PENDING'
        (в том же направлении или встречное). Ничего не создаётся и не меняется; тело — в формате ошибки
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 200
            detail: Предложение дружбы уже отправлено
            code: FRIENDSHIP_OFFER_ALREADY_PENDING
    '400':
      description: >-
        Некорректный запрос: тело не читается, отсутствует `toUserId` или он не является UUID,
        либо `toUserId` совпадает с X-User-Id (предложение дружбы самому себе).
        Невалидное тело без X-User-Id — тоже `400`: тело проверяется раньше заголовка
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '401':
      $ref: '../responses/unauthorized.yaml'
    '409':
      description: >-
        Предложение дружбы между этими пользователями (в том же направлении или встречное) уже существует
        и его статус отличен от 'PENDING' ('ACCEPTED' или 'REJECTED'), либо заявка пары есть,
        но её статус не удалось прочитать ('FRIENDSHIP_OFFER_ALREADY_EXISTS')
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          examples:
            accepted:
              value:
                status: 409
                detail: Предложение дружбы уже принято
                code: FRIENDSHIP_OFFER_ALREADY_ACCEPTED
            rejected:
              value:
                status: 409
                detail: Предложение дружбы уже отклонено
                code: FRIENDSHIP_OFFER_ALREADY_REJECTED
            exists:
              value:
                status: 409
                detail: Предложение дружбы для этой пары уже существует
                code: FRIENDSHIP_OFFER_ALREADY_EXISTS
    '500':
      $ref: '../responses/internal-error.yaml'
