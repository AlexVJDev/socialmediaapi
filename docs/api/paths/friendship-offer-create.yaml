post:
  tags:
    - Friendship
  summary: Создать предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - fromUserId
            - toUserId
          properties:
            fromUserId:
              type: string
              format: uuid
              example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
            toUserId:
              type: string
              format: uuid
              example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
  responses:
    '201':
      description: Предложение дружбы создано
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
              - createdAt
            properties:
              id:
                type: string
                format: uuid
                example: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
              fromUserId:
                type: string
                format: uuid
                example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
              toUserId:
                type: string
                format: uuid
                example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: PENDING
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
    '200':
      description: >-
        Предложение дружбы между этими пользователями уже существует и находится в статусе 'PENDING'
        (в том же направлении или встречное), либо заявка пары есть, но её статус не удалось прочитать.
        Ничего не создаётся и не меняется
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                enum: [FRIENDSHIP_OFFER_ALREADY_PENDING]
                example: FRIENDSHIP_OFFER_ALREADY_PENDING
              message:
                type: string
                example: Предложение дружбы уже отправлено
    '400':
      description: >-
        Некорректный запрос: тело не читается, отсутствует `fromUserId` или `toUserId`,
        идентификатор не является UUID, либо `fromUserId` совпадает с `toUserId`
        (предложение дружбы самому себе)
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_FRIENDSHIP_OFFER_REQUEST
              message:
                type: string
                example: Некорректное тело запроса, отсутствуют обязательные поля или пользователь предлагает дружбу самому себе
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь-инициатор или пользователь-получатель не найден
    '409':
      description: >-
        Предложение дружбы между этими пользователями (в том же направлении или встречное) уже существует
        и его статус отличен от 'PENDING' ('ACCEPTED' или 'REJECTED')
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                enum: [FRIENDSHIP_OFFER_ALREADY_ACCEPTED, FRIENDSHIP_OFFER_ALREADY_REJECTED]
                example: FRIENDSHIP_OFFER_ALREADY_REJECTED
              message:
                type: string
                example: Предложение дружбы уже обработано и не может быть создано повторно
