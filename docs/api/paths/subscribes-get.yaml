get:
  tags:
    - Subscribe
  summary: Получить список подписок пользователя
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список подписок
      schema:
        type: string
        format: uuid
        example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
  responses:
    '200':
      description: Список пользователей, на которых подписан текущий пользователь
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
                - userId
              properties:
                id:
                  type: string
                  format: uuid
                  description: Идентификатор подписки
                  example: d4e5f6a7-8b9c-4d0e-9f1a-2b3c4d5e6f03
                userId:
                  type: string
                  format: uuid
                  description: Идентификатор пользователя, на которого оформлена подписка
                  example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
          examples:
            found:
              value:
                - id: d4e5f6a7-8b9c-4d0e-9f1a-2b3c4d5e6f03
                  userId: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
                - id: d4e5f6a7-8b9c-4d0e-9f1a-2b3c4d5e6f04
                  userId: a3c8e5f1-6d2b-4f7e-9a10-8b4c2d6e7f88
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
          example:
            code: INVALID_USER_ID
            message: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
          example:
            code: USER_NOT_FOUND
            message: Пользователь не найден
