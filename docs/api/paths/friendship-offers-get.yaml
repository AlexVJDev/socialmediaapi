get:
  tags:
    - FriendshipOffer
  summary: Получить страницу заявок текущего пользователя
  operationId: getFriendshipOffers
  security:
    - userIdHeader: []
  description: >-
    Заявки, где текущий пользователь (заголовок X-User-Id) получатель (`direction=INCOMING`)
    или отправитель (`direction=OUTGOING`), в статусе `status` (по умолчанию `PENDING`),
    от новых к старым (`createdAt DESC, id DESC`). Страницы читаются по курсору, как лента:
    первая — без `afterCreatedAt`/`afterId`, следующая — с `afterCreatedAt = next.createdAt`
    и `afterId = next.id` из предыдущего ответа. `next: null` — заявок больше нет.
    Нет заявок или неизвестный пользователь — пустая страница.
  parameters:
    - name: direction
      in: query
      required: true
      description: '`INCOMING` — входящие заявки текущего пользователя, `OUTGOING` — исходящие'
      schema:
        $ref: '../schemas/friendship-offer-direction.yaml'
    - name: status
      in: query
      required: false
      description: Статус заявок (по умолчанию `PENDING`)
      schema:
        $ref: '../schemas/friendship-offer-status.yaml'
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: afterCreatedAt
      in: query
      required: false
      description: '`next.createdAt` предыдущей страницы; задаётся вместе с `afterId`'
      schema:
        type: string
        format: date-time
    - name: afterId
      in: query
      required: false
      description: '`next.id` предыдущей страницы; задаётся вместе с `afterCreatedAt`'
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Страница заявок (может быть пустой)
      content:
        application/json:
          schema:
            $ref: '../schemas/friendship-offer-page.yaml'
          examples:
            incoming:
              summary: Входящие B (X-User-Id = 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22, direction=INCOMING)
              value:
                offers:
                  - id: 2f6b9d13-8e4a-4b1c-a7d5-3c9e0f1b2a55
                    fromUserId: 7d1f0a52-2b8e-4c9a-b3d6-4e8f1a2c5b66
                    toUserId: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
                    status: PENDING
                    createdAt: '2026-09-22T10:25:00Z'
                    updatedAt: '2026-09-22T10:25:00Z'
                  - id: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
                    fromUserId: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
                    toUserId: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
                    status: PENDING
                    createdAt: '2026-09-22T10:15:00Z'
                    updatedAt: '2026-09-22T10:15:00Z'
                next: null
            empty:
              summary: Заявок нет
              value:
                offers: []
                next: null
    '400':
      description: >-
        Некорректные параметры: `direction` нет или не из списка, `status` не из списка,
        `limit` вне 1..100 или не число, `afterCreatedAt` не дата-время, `afterId` не UUID,
        задана только одна часть курсора
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '401':
      $ref: '../responses/unauthorized.yaml'
    '500':
      $ref: '../responses/internal-error.yaml'
