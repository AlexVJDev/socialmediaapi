get:
  summary: Получить список подписчиков пользователя
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список подписчиков
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    '200':
      description: Список пользователей, подписанных на текущего пользователя
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  format: int64
                  description: Идентификатор пользователя-подписчика
                  example: 1
          examples:
            found:
              value:
                - userId: 1
                - userId: 3
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_USER_ID
              message:
                type: string
                example: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь не найден
