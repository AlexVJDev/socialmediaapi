get:
  tags:
    - Subscribe
  summary: Получить список подписчиков пользователя
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список подписчиков
      schema:
        type: string
        format: uuid
        example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
  responses:
    '200':
      description: Список пользователей, подписанных на текущего пользователя
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
                - userId
              properties:
                id:
                  type: string
                  format: uuid
                  description: Идентификатор подписки
                  example: d4e5f6a7-8b9c-4d0e-9f1a-2b3c4d5e6f01
                userId:
                  type: string
                  format: uuid
                  description: Идентификатор пользователя-подписчика
                  example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
          examples:
            found:
              value:
                - id: d4e5f6a7-8b9c-4d0e-9f1a-2b3c4d5e6f01
                  userId: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
                - id: d4e5f6a7-8b9c-4d0e-9f1a-2b3c4d5e6f02
                  userId: 7d1f0a52-2b8e-4c9a-b3d6-4e8f1a2c5b66
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
          example:
            code: INVALID_USER_ID
            message: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
          example:
            code: USER_NOT_FOUND
            message: Пользователь не найден
