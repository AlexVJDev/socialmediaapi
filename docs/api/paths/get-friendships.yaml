get:
  summary: Get the friends list
  parameters:
    - name: userId
      in: query
      required: true
      description: Identifier of the user whose friends list should be returned
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    '200':
      description: User's friends list
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
                - username
                - displayName
              properties:
                id:
                  type: integer
                  format: int64
                  example: 2
                username:
                  type: string
                  example: boris
                displayName:
                  type: string
                  example: Boris
          examples:
            found:
              value:
                - id: 2
                  username: boris
                  displayName: Boris
                - id: 3
                  username: maria
                  displayName: Maria
            empty:
              value: []
    '400':
      description: Invalid or missing userId parameter
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_USER_ID
              message:
                type: string
                example: Invalid or missing userId parameter
    '404':
      description: User not found
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: User was not found
