get:
  tags:
    - Friendship
  summary: Получить список друзей
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список друзей
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    '200':
      description: Список друзей пользователя
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  format: int64
                  description: Идентификатор пользователя-друга
                  example: 2
          examples:
            found:
              value:
                - userId: 2
                - userId: 3
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_USER_ID
              message:
                type: string
                example: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь не найден
