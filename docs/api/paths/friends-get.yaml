get:
  tags:
    - Friendship
  summary: Получить страницу друзей пользователя
  operationId: getFriends
  description: >-
    Активные дружбы пользователя `userId` от новых к старым (`createdAt DESC, id DESC` дружбы).
    Страницы читаются по курсору, как лента: первая — без `afterCreatedAt`/`afterId`, следующая —
    с `afterCreatedAt = next.createdAt` и `afterId = next.id` из предыдущего ответа.
    `next: null` — друзей больше нет. Нет друзей или неизвестный пользователь — пустая страница.
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список друзей
      schema:
        type: string
        format: uuid
        example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: afterCreatedAt
      in: query
      required: false
      description: '`next.createdAt` предыдущей страницы; задаётся вместе с `afterId`'
      schema:
        type: string
        format: date-time
    - name: afterId
      in: query
      required: false
      description: '`next.id` предыдущей страницы; задаётся вместе с `afterCreatedAt`'
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Страница друзей (может быть пустой)
      content:
        application/json:
          schema:
            $ref: '../schemas/friend-page.yaml'
          examples:
            found:
              summary: Друзья A (userId = 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01)
              value:
                friends:
                  - id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e02
                    userId: 7d1f0a52-2b8e-4c9a-b3d6-4e8f1a2c5b66
                next: null
            empty:
              summary: Друзей нет
              value:
                friends: []
                next: null
    '400':
      description: >-
        Некорректные параметры: `userId` нет или не UUID, `limit` вне 1..100 или не число,
        `afterCreatedAt` не дата-время, `afterId` не UUID, задана только одна часть курсора
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '500':
      $ref: '../responses/internal-error.yaml'
