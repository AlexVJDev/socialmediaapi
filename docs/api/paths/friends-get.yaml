get:
  tags:
    - Friendship
  summary: Получить список друзей
  operationId: getFriends
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список друзей
      schema:
        type: string
        format: uuid
        example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
  responses:
    '200':
      description: Список друзей пользователя
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
                - userId
              properties:
                id:
                  type: string
                  format: uuid
                  description: Идентификатор дружбы
                  example: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e01
                userId:
                  type: string
                  format: uuid
                  description: Идентификатор пользователя-друга
                  example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
          examples:
            found:
              value:
                - id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e01
                  userId: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
                - id: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e02
                  userId: 7d1f0a52-2b8e-4c9a-b3d6-4e8f1a2c5b66
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_USER_ID
              message:
                type: string
                example: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь не найден
