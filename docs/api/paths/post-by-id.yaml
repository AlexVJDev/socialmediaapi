get:
  tags:
    - Post
  summary: Получить опубликованный пост по идентификатору
  operationId: getPost
  parameters:
    - name: postId
      in: path
      required: true
      description: Идентификатор поста
      schema:
        type: string
        format: uuid
      example: 7d1f3c2a-5b6e-4f80-9a1b-2c3d4e5f6a7b
  responses:
    '200':
      description: Опубликованный пост
      content:
        application/json:
          schema:
            $ref: '../schemas/post.yaml'
    '400':
      description: Идентификатор поста не является UUID или пуст
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '404':
      description: Поста нет или он удалён (удалённый пост читается как отсутствующий)
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 404
            detail: Пост не найден
            code: POST_NOT_FOUND
    '500':
      $ref: '../responses/internal-error.yaml'
put:
  tags:
    - Post
  summary: Изменить заголовок и текст своего поста
  operationId: updatePost
  security:
    - userIdHeader: []
  parameters:
    - name: postId
      in: path
      required: true
      description: Идентификатор поста
      schema:
        type: string
        format: uuid
      example: 7d1f3c2a-5b6e-4f80-9a1b-2c3d4e5f6a7b
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/post-request.yaml'
  responses:
    '200':
      description: Пост изменён
      content:
        application/json:
          schema:
            $ref: '../schemas/post.yaml'
    '400':
      description: >-
        Идентификатор не UUID; тело не читается, нет `title` или `content`, длина вне допустимой,
        строка только из пробелов
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '401':
      $ref: '../responses/unauthorized.yaml'
    '404':
      description: Поста нет, он удалён или принадлежит другому пользователю
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 404
            detail: Пост не найден
            code: POST_NOT_FOUND
    '500':
      $ref: '../responses/internal-error.yaml'
delete:
  tags:
    - Post
  summary: Удалить свой пост
  description: Пост помечается удалённым и больше не читается; повторное удаление — `404`
  operationId: deletePost
  security:
    - userIdHeader: []
  parameters:
    - name: postId
      in: path
      required: true
      description: Идентификатор поста
      schema:
        type: string
        format: uuid
      example: 7d1f3c2a-5b6e-4f80-9a1b-2c3d4e5f6a7b
  responses:
    '204':
      description: Пост удалён
    '400':
      description: Идентификатор поста не является UUID
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '401':
      $ref: '../responses/unauthorized.yaml'
    '404':
      description: Поста нет, он уже удалён или принадлежит другому пользователю
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 404
            detail: Пост не найден
            code: POST_NOT_FOUND
    '500':
      $ref: '../responses/internal-error.yaml'
