get:
  tags:
    - Posts
  summary: Получить опубликованный пост по идентификатору
  parameters:
    - name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 7d1f3c2a-5b6e-4f80-9a1b-2c3d4e5f6a7b
  responses:
    '200':
      description: Опубликованный пост
      content:
        application/json:
          schema:
            $ref: '../schemas/post.yaml'
    '400':
      description: Идентификатор поста не является UUID
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
          example:
            code: INVALID_POST_REQUEST
            message: Некорректные параметры запроса
    '404':
      description: Поста нет или он удалён (удалённый пост читается как отсутствующий)
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
          example:
            code: POST_NOT_FOUND
            message: Пост не найден
