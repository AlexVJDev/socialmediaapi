get:
  summary: Получить список подписок пользователя
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить список подписок
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    '200':
      description: Список пользователей, на которых подписан текущий пользователь
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
                - username
                - displayName
              properties:
                id:
                  type: integer
                  format: int64
                  example: 2
                username:
                  type: string
                  example: boris
                displayName:
                  type: string
                  example: Boris
          examples:
            found:
              value:
                - id: 2
                  username: boris
                  displayName: Boris
                - id: 4
                  username: ivan
                  displayName: Ivan
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_USER_ID
              message:
                type: string
                example: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь не найден
