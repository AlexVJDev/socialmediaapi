post:
  tags:
    - Friendship
  summary: Отклонить предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - offerId
            - actorId
          properties:
            offerId:
              type: string
              format: uuid
              description: Идентификатор отклоняемого предложения дружбы.
              example: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
            actorId:
              type: string
              format: uuid
              description: >-
                Пользователь, выполняющий действие, — получатель предложения.
                Передаётся в теле до подключения аутентификации (Keycloak), затем будет браться из токена.
              example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
  responses:
    '200':
      description: >-
        Предложение дружбы отклонено. Дружба не создаётся, подписка инициатора на получателя сохраняется
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
              - createdAt
              - rejectedAt
            properties:
              id:
                type: string
                format: uuid
                example: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
              fromUserId:
                type: string
                format: uuid
                example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
              toUserId:
                type: string
                format: uuid
                example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: REJECTED
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
              rejectedAt:
                type: string
                format: date-time
                description: Время смены статуса (`updated_at` заявки).
                example: '2026-09-22T10:20:00Z'
    '400':
      description: >-
        Некорректный запрос: тело не читается, отсутствует `offerId` или `actorId`,
        идентификатор не является UUID
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_FRIENDSHIP_OFFER_REQUEST
              message:
                type: string
                example: Некорректное тело запроса или отсутствуют обязательные поля
    '404':
      description: >-
        Предложение дружбы не найдено: его нет или `actorId` не является его получателем
        (существование чужой заявки не раскрывается)
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: FRIENDSHIP_OFFER_NOT_FOUND
              message:
                type: string
                example: Предложение дружбы не найдено
    '409':
      description: >-
        Предложение дружбы нельзя отклонить, так как его статус отличен от 'PENDING' ('ACCEPTED' или 'REJECTED');
        в том числе повторное отклонение. Данные не меняются
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                enum: [FRIENDSHIP_OFFER_ALREADY_ACCEPTED, FRIENDSHIP_OFFER_ALREADY_REJECTED]
                example: FRIENDSHIP_OFFER_ALREADY_ACCEPTED
              message:
                type: string
                example: Предложение дружбы уже принято
