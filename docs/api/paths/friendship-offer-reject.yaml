post:
  tags:
    - FriendshipOffer
  summary: Отклонить предложение дружбы
  operationId: rejectFriendshipOffer
  security:
    - userIdHeader: []
  description: >-
    Действующий пользователь — текущий (заголовок X-User-Id); отклонить заявку может только её получатель.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - offerId
          properties:
            offerId:
              type: string
              format: uuid
              description: Идентификатор отклоняемого предложения дружбы.
              example: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
  responses:
    '200':
      description: >-
        Предложение дружбы отклонено. Дружба не создаётся, подписка инициатора на получателя сохраняется
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
              - createdAt
              - rejectedAt
            properties:
              id:
                type: string
                format: uuid
                example: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
              fromUserId:
                type: string
                format: uuid
                example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
              toUserId:
                type: string
                format: uuid
                example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
              status:
                type: string
                enum: [REJECTED]
                example: REJECTED
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
              rejectedAt:
                type: string
                format: date-time
                description: Время смены статуса (`updated_at` заявки).
                example: '2026-09-22T10:20:00Z'
    '400':
      description: >-
        Некорректный запрос: тело не читается, отсутствует `offerId` или он не является UUID.
        Невалидное тело без X-User-Id — тоже `400`: тело проверяется раньше заголовка
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '401':
      $ref: '../responses/unauthorized.yaml'
    '404':
      description: >-
        Предложение дружбы не найдено: его нет или текущий пользователь (X-User-Id) не является его получателем
        (существование чужой заявки не раскрывается)
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 404
            detail: Предложение дружбы не найдено
            code: FRIENDSHIP_OFFER_NOT_FOUND
    '409':
      description: >-
        Предложение дружбы нельзя отклонить, так как его статус отличен от 'PENDING' ('ACCEPTED' или 'REJECTED');
        в том числе повторное отклонение. Данные не меняются
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          examples:
            accepted:
              value:
                status: 409
                detail: Предложение дружбы уже принято
                code: FRIENDSHIP_OFFER_ALREADY_ACCEPTED
            rejected:
              value:
                status: 409
                detail: Предложение дружбы уже отклонено
                code: FRIENDSHIP_OFFER_ALREADY_REJECTED
    '500':
      $ref: '../responses/internal-error.yaml'
