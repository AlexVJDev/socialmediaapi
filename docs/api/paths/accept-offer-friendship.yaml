post:
  summary: Accept a friendship offer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - fromUserId
            - toUserId
          properties:
            fromUserId:
              type: integer
              format: int64
              example: 1
            toUserId:
              type: integer
              format: int64
              example: 2
  responses:
    '200':
      description: Friendship offer accepted
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
              - createdAt
              - acceptedAt
            properties:
              id:
                type: integer
                format: int64
                example: 10
              fromUserId:
                type: integer
                format: int64
                example: 1
              toUserId:
                type: integer
                format: int64
                example: 2
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: ACCEPTED
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
              acceptedAt:
                type: string
                format: date-time
                example: '2026-09-22T10:20:00Z'
    '400':
      description: Invalid input data
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_FRIENDSHIP_OFFER_REQUEST
              message:
                type: string
                example: Invalid request body or missing required fields
    '404':
      description: Friendship offer not found
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: FRIENDSHIP_OFFER_NOT_FOUND
              message:
                type: string
                example: Friendship offer was not found
    '409':
      description: Friendship offer cannot be accepted because of its current state
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: OFFER_FRIENDSHIP_ALREADY_REJECTED
              message:
                type: string
                example: A rejected friendship offer cannot be accepted
