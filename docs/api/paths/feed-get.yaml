get:
  tags:
    - Feed
  summary: Получить страницу ленты текущего пользователя
  operationId: getFeed
  security:
    - userIdHeader: []
  description: >-
    Опубликованные посты авторов, на которых подписан текущий пользователь (заголовок X-User-Id), от новых к старым
    (`createdAt DESC, id DESC`). Собственные и удалённые посты в ленту не попадают.
    Страницы читаются по курсору: первая — без `afterCreatedAt`/`afterId`, следующая —
    с `afterCreatedAt = next.createdAt` и `afterId = next.id` из предыдущего ответа.
    `next: null` — постов больше нет. См. `docs/process/Feed.md`.
  parameters:
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: afterCreatedAt
      in: query
      required: false
      description: '`next.createdAt` предыдущей страницы; задаётся вместе с `afterId`'
      schema:
        type: string
        format: date-time
    - name: afterId
      in: query
      required: false
      description: '`next.id` предыдущей страницы; задаётся вместе с `afterCreatedAt`'
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Страница ленты (может быть пустой)
      content:
        application/json:
          schema:
            $ref: '../schemas/post-page.yaml'
    '400':
      description: >-
        Некорректные параметры: `afterId` не UUID, `limit` вне 1..100
        или не число, задана только одна часть курсора
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/api-error-response.yaml'
          example:
            status: 400
            detail: Некорректное тело или параметры запроса
            code: VALIDATION_ERROR
    '401':
      $ref: '../responses/unauthorized.yaml'
    '500':
      $ref: '../responses/internal-error.yaml'
