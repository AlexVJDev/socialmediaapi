get:
  tags:
    - Posts
  summary: Получить страницу ленты подписчика
  description: >-
    Опубликованные посты авторов, на которых подписан читатель, от новых к старым
    (`createdAt DESC, id DESC`). Собственные и удалённые посты в ленту не попадают.
    Страницы читаются по курсору: первая — без `afterCreatedAt`/`afterId`, следующая —
    с `afterCreatedAt = next.createdAt` и `afterId = next.id` из предыдущего ответа.
    `next: null` — постов больше нет. См. `docs/process/Feed.md`.
  parameters:
    - name: followerId
      in: query
      required: true
      description: >-
        Читатель ленты. Передаётся параметром до подключения аутентификации (Keycloak),
        затем будет браться из токена.
      schema:
        type: string
        format: uuid
      example: 55555555-5555-5555-5555-555555555555
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: afterCreatedAt
      in: query
      required: false
      description: '`next.createdAt` предыдущей страницы; задаётся вместе с `afterId`'
      schema:
        type: string
        format: date-time
      example: '2026-10-15T10:00:00.123456Z'
    - name: afterId
      in: query
      required: false
      description: '`next.id` предыдущей страницы; задаётся вместе с `afterCreatedAt`'
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Страница ленты (может быть пустой)
      content:
        application/json:
          schema:
            type: object
            required: [posts, next]
            properties:
              posts:
                type: array
                items:
                  $ref: '../schemas/post.yaml'
              next:
                type: object
                nullable: true
                description: Курсор следующей страницы — позиция последнего поста; `null`, если постов больше нет
                required: [createdAt, id]
                properties:
                  createdAt:
                    type: string
                    format: date-time
                    example: '2026-10-15T10:00:00.123456Z'
                  id:
                    type: string
                    format: uuid
    '400':
      description: >-
        Некорректные параметры: нет `followerId`, идентификатор не UUID, `limit` вне 1..100
        или не число, задана только одна часть курсора
      content:
        application/json:
          schema:
            $ref: '../schemas/error.yaml'
          example:
            code: INVALID_POST_REQUEST
            message: Некорректные параметры запроса
