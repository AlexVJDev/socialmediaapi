get:
  tags:
    - FriendshipOffer
  summary: Получить исходящие предложения дружбы
  operationId: getOutgoingFriendshipOffers
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя, для которого нужно получить исходящие предложения дружбы
      schema:
        type: string
        format: uuid
        example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
  responses:
    '200':
      description: Список исходящих предложений дружбы
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/friendship-offer.yaml'
          examples:
            found:
              value:
                - id: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
                  fromUserId: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
                  toUserId: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
                  status: PENDING
                  createdAt: '2026-09-22T10:15:00Z'
                  updatedAt: '2026-09-22T10:15:00Z'
                - id: e8a4c2d6-1f3b-4e9d-b5c7-6a2d8f0e4b77
                  fromUserId: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
                  toUserId: a3c8e5f1-6d2b-4f7e-9a10-8b4c2d6e7f88
                  status: PENDING
                  createdAt: '2026-09-22T10:30:00Z'
                  updatedAt: '2026-09-22T10:30:00Z'
            empty:
              value: []
    '400':
      description: Некорректный или отсутствующий параметр userId
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: INVALID_USER_ID
              message:
                type: string
                example: Некорректный или отсутствующий параметр userId
    '404':
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: USER_NOT_FOUND
              message:
                type: string
                example: Пользователь не найден
