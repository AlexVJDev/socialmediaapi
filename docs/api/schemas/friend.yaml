    type: string
    format: uuid
    description: Идентификатор дружбы
    example: c1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e02
  userId:
    type: string
    format: uuid
    description: Идентификатор пользователя-друга (второй участник дружбы)
    example: 7d1f0a52-2b8e-4c9a-b3d6-4e8f1a2c5b66
