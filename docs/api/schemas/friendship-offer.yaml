type: object
description: Предложение дружбы
required: [id, fromUserId, toUserId, status, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
    example: 9c4e1b77-3f2a-4d6c-8b0e-1a5f7d2c3e44
  fromUserId:
    type: string
    format: uuid
    description: Инициатор предложения
    example: 0b6f3c9e-6a1d-4c2e-9f5a-2d7b8e1c4a01
  toUserId:
    type: string
    format: uuid
    description: Получатель предложения
    example: 5e2a7d40-91c3-4b8f-a6e2-7c0d3f9b1e22
  status:
    type: string
    enum: [PENDING, ACCEPTED, REJECTED]
    example: ACCEPTED
  createdAt:
    type: string
    format: date-time
    example: '2026-09-22T10:15:00.123456Z'
  updatedAt:
    type: string
    format: date-time
    description: Время последнего изменения; для решённой заявки — время принятия или отклонения
    example: '2026-09-22T10:20:00.654321Z'
